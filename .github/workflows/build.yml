
name: Build Smoochiee Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Bruce for Smoochiee Board
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build Smoochiee Board
        run: |
          pio run -e smoochiee-board

      - name: Show generated firmware files
        run: |
          echo "Generated files:"
          ls -lah .pio/build/smoochiee-board/

      - name: Upload Smoochiee Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-Smoochiee-Firmware
          path: .pio/build/smoochiee-board/
          if-no-files-found: error
